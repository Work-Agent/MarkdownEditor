name: Release plugin

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish plugin zip
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      # SDK 目前没有发 npm；从 WorkStudio 源码构建后，让
      # file:../WorkStudio/packages/sdk 依赖在 CI 里可解析。
      # WorkStudio 与插件仓库分离；WorkStudio 是私有仓库时，
      # 需要 WORKSTUDIO_TOKEN（至少 contents: read）才能 checkout。
      - name: Check WorkStudio access token
        env:
          WORKSTUDIO_TOKEN: ${{ secrets.WORKSTUDIO_TOKEN }}
        run: |
          if [ -z "$WORKSTUDIO_TOKEN" ]; then
            echo "::error::Missing WORKSTUDIO_TOKEN secret with read access to Work-Agent/WorkStudio."
            exit 1
          fi

      - name: Checkout WorkStudio SDK
        uses: actions/checkout@v4
        with:
          repository: Work-Agent/WorkStudio
          path: WorkStudio
          fetch-depth: 1
          token: ${{ secrets.WORKSTUDIO_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            plugin/pnpm-lock.yaml
            WorkStudio/pnpm-lock.yaml

      - name: Build WorkStudio SDK
        working-directory: WorkStudio
        run: |
          set -euo pipefail
          # ignore-scripts 跳过 electron 二进制下载；这里只需要 SDK 的 tsc。
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @workstudio/sdk build

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        working-directory: plugin
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          # 当前 tag 是 0.1 这样的短版本，package.json 是 0.1.0；两者都接受。
          if [ "$TAG" != "$VERSION" ] && [ "${TAG}.0" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Typecheck
        working-directory: plugin
        run: pnpm typecheck

      - name: Build
        working-directory: plugin
        run: pnpm build

      - name: Pack plugin zip
        working-directory: plugin
        run: pnpm pack:plugin

      - name: Verify zip
        working-directory: plugin
        run: |
          set -euo pipefail
          ZIP="$(ls release/*.zip | head -n1)"
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -q 'dist/engine.js'
          unzip -l "$ZIP" | grep -q 'dist/page/index.html'
          unzip -l "$ZIP" | grep -q 'dist/settings/index.html'
          unzip -l "$ZIP" | grep -q 'skills/markdown-editor/SKILL.md'
          unzip -p "$ZIP" package.json | node -e "
            let s = '';
            process.stdin.on('data', (d) => (s += d));
            process.stdin.on('end', () => {
              const pkg = JSON.parse(s);
              if (pkg.workstudio?.id !== 'markdown-editor') process.exit(1);
              if (pkg.dependencies || pkg.devDependencies) process.exit(2);
            });
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            plugin/release/*.zip
            plugin/release/*.sha256
